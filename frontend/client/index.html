<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Tablet Wall</title>
    <link rel="stylesheet" href="client.css?v=3">
</head>
<body>
    <canvas id="surface" aria-hidden="true"></canvas>
    <div id="status" data-state="connecting" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">Connecting&hellip;</span>
    </div>
    <button id="takeover" type="button" hidden>Take over this screen</button>
    <button id="fs-toggle" type="button" hidden aria-label="Enter full screen">Full screen</button>
    <script src="client.js?v=3"></script>
</body>
</html>
