<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Tablet Wall</title>
    <link rel="stylesheet" href="client.css?v=4">
</head>
<body>
    <canvas id="surface" aria-hidden="true"></canvas>
    <div id="status" data-state="connecting" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">Connecting&hellip;</span>
    </div>
    <div id="hud" role="status" aria-live="polite" aria-atomic="true" data-visible="false">
        <span id="hud-identity" class="hud-identity"></span>
        <span id="hud-state" class="hud-state"></span>
    </div>
    <div id="video-unavailable" role="status" aria-live="polite" data-visible="false"></div>
    <button id="takeover" type="button" hidden>Take over this screen</button>
    <button id="fs-toggle" type="button" hidden aria-label="Enter full screen">Full screen</button>
    <script src="view.js?v=2"></script>
    <script src="client.js?v=12"></script>
    <script src="ruler.js?v=1"></script>
</body>
</html>
