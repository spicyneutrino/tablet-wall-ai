<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="rec-title rec-desc">
<title id="rec-title">Reconnect during video is a group recovery at the live playhead, not a fresh start.</title>
<desc id="rec-desc">Reconnect during video is a group recovery at the live playhead, not a fresh start.</desc>
<defs>
  <marker id="rec-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-muted, #56655d)"/>
  </marker>
  <pattern id="rec-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="var(--fig-dot, #d6e0d9)"/>
  </pattern>
</defs>

<style>
svg .bg { fill: var(--fig-bg, #f6f8f4); }
svg .surface { fill: var(--fig-surface, #ffffff); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-2 { fill: var(--fig-surface-2, #eef3ef); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-accent { fill: var(--fig-accent-soft, #dff1ec); stroke: var(--fig-accent, #0b6b63); stroke-width: 1.4; }
svg .surface-warn { fill: var(--fig-warn-soft, #f6ead8); stroke: var(--fig-warn, #985a00); stroke-width: 1.2; }
svg .surface-bad { fill: var(--fig-bad-soft, #f6e1df); stroke: var(--fig-bad, #a43a31); stroke-width: 1.2; }
svg .wall { fill: var(--fig-wall, #101b17); stroke: var(--fig-wall-line, #2b3b34); stroke-width: 1.2; }
svg .line { stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .line-strong { stroke: var(--fig-line-strong, #9fb0a6); stroke-width: 1.6; }
svg .arrow { stroke: var(--fig-muted, #56655d); stroke-width: 1.5; fill: none; }
svg .arrow-accent { stroke: var(--fig-accent, #0b6b63); stroke-width: 1.8; fill: none; }
svg .arrow-warn { stroke: var(--fig-warn, #985a00); stroke-width: 1.6; fill: none; }
svg .dot { fill: var(--fig-accent, #0b6b63); }
svg .dot-warn { fill: var(--fig-warn, #985a00); }
svg .dot-bad { fill: var(--fig-bad, #a43a31); }
svg .dot-muted { fill: var(--fig-muted, #56655d); }
svg text { font-family: Cantarell, ui-sans-serif, system-ui, sans-serif; fill: var(--fig-ink, #15211b); }
svg .t { font-size: 14px; }
svg .small { font-size: 12.5px; fill: var(--fig-muted, #56655d); }
svg .tiny { font-size: 11.5px; fill: var(--fig-muted, #56655d); letter-spacing: .02em; }
svg .label { font-size: 14.5px; }
svg .label-strong { font-size: 14px; font-weight: 700; }
svg .title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
svg .display { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
svg .num { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; fill: var(--fig-accent, #0b6b63); letter-spacing: .04em; }
svg .mono { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
svg .mono-strong { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; }
svg .accent { fill: var(--fig-accent, #0b6b63); }
svg .warn { fill: var(--fig-warn, #985a00); }
svg .bad { fill: var(--fig-bad, #a43a31); }
svg .muted { fill: var(--fig-muted, #56655d); }
svg .ink { fill: var(--fig-ink, #15211b); }
svg .panel-label { font-size: 12px; font-weight: 700; fill: var(--fig-wall-ink, #e6efe9); }
svg .panel-small { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: var(--fig-wall-muted, #93a69c); }
</style>

<rect class="bg" width="960" height="560"/>
<rect width="960" height="560" fill="url(#rec-dots)" opacity=".55"/>
<text class="mono" x="52" y="38" text-anchor="start" >RECOVERY WINDOW</text><text class="small" x="908" y="38" text-anchor="end" >same occurrence, live playhead</text><line class="line-strong" x1="88" y1="136" x2="884" y2="136" /><circle class="dot-warn" cx="88.0" cy="136" r="5"/><text class="mono-strong" x="88.0" y="118" text-anchor="middle" >drop</text><text class="tiny" x="88.0" y="164" text-anchor="middle" >socket closes</text><circle class="dot-warn" cx="207.4" cy="136" r="5"/><text class="mono-strong" x="207.4" y="118" text-anchor="middle" >backoff</text><text class="tiny" x="207.4" y="164" text-anchor="middle" >≤ 5 s cap</text><circle class="dot-warn" cx="374.56" cy="136" r="5"/><text class="mono-strong" x="374.56" y="118" text-anchor="middle" >register</text><text class="tiny" x="374.56" y="164" text-anchor="middle" >re-register</text><circle class="dot" cx="501.92" cy="136" r="5"/><text class="mono-strong" x="501.92" y="118" text-anchor="middle" >prepare</text><text class="tiny" x="501.92" y="164" text-anchor="middle" >position-aware</text><circle class="dot" cx="692.96" cy="136" r="5"/><text class="mono-strong" x="692.96" y="118" text-anchor="middle" >commit</text><text class="tiny" x="692.96" y="164" text-anchor="middle" >common anchor</text><circle class="dot" cx="804.4" cy="136" r="5"/><text class="mono-strong" x="804.4" y="118" text-anchor="middle" >playing</text><text class="tiny" x="804.4" y="164" text-anchor="middle" >group resumes</text><rect class="surface-bad" x="88" y="200" width="260" height="28" rx="2"/><text class="small" x="96" y="219" text-anchor="start" >freeze cohort</text><rect class="surface-accent" x="501.92" y="200" width="290" height="28" rx="2"/><text class="small" x="509.92" y="219" text-anchor="start" >prepare all members</text><rect class="surface-warn" x="88" y="270" width="350" height="86" rx="4"/><text class="label-strong" x="104" y="296" text-anchor="start" >second drop during recovery</text><text class="small" x="104" y="318" text-anchor="start" >coalesced within 2 s</text><text class="small" x="104" y="336" text-anchor="start" >no new attempt consumed</text><rect class="surface-2" x="520" y="270" width="364" height="86" rx="4"/><text class="label-strong" x="536" y="296" text-anchor="start" >bounded automatic attempts</text><text class="small" x="536" y="318" text-anchor="start" >3 attempts → blocked / failed → Retry</text><text class="small" x="536" y="336" text-anchor="start" >operator can stop or start again</text><text class="title" x="88" y="420" text-anchor="start" >A reconnect during video is not a fresh start.</text><text class="small" x="88" y="446" text-anchor="start" >The server freezes the cohort, reads the live position, and re-prepares the same occurrence.</text><text class="small" x="88" y="466" text-anchor="start" >The client&#x27;s persisted scene is the fallback if recovery cannot finish.</text>
</svg>
