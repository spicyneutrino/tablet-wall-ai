<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ui-title ui-desc">
<title id="ui-title">The tablet draws a full-screen wall slice while the console edits and observes.</title>
<desc id="ui-desc">The tablet draws a full-screen wall slice while the console edits and observes.</desc>
<defs>
  <marker id="ui-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-muted, #56655d)"/>
  </marker>
  <pattern id="ui-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="var(--fig-dot, #d6e0d9)"/>
  </pattern>
</defs>

<style>
svg .bg { fill: var(--fig-bg, #f6f8f4); }
svg .surface { fill: var(--fig-surface, #ffffff); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-2 { fill: var(--fig-surface-2, #eef3ef); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-accent { fill: var(--fig-accent-soft, #dff1ec); stroke: var(--fig-accent, #0b6b63); stroke-width: 1.4; }
svg .surface-warn { fill: var(--fig-warn-soft, #f6ead8); stroke: var(--fig-warn, #985a00); stroke-width: 1.2; }
svg .surface-bad { fill: var(--fig-bad-soft, #f6e1df); stroke: var(--fig-bad, #a43a31); stroke-width: 1.2; }
svg .wall { fill: var(--fig-wall, #101b17); stroke: var(--fig-wall-line, #2b3b34); stroke-width: 1.2; }
svg .line { stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .line-strong { stroke: var(--fig-line-strong, #9fb0a6); stroke-width: 1.6; }
svg .arrow { stroke: var(--fig-muted, #56655d); stroke-width: 1.5; fill: none; }
svg .arrow-accent { stroke: var(--fig-accent, #0b6b63); stroke-width: 1.8; fill: none; }
svg .arrow-warn { stroke: var(--fig-warn, #985a00); stroke-width: 1.6; fill: none; }
svg .dot { fill: var(--fig-accent, #0b6b63); }
svg .dot-warn { fill: var(--fig-warn, #985a00); }
svg .dot-bad { fill: var(--fig-bad, #a43a31); }
svg .dot-muted { fill: var(--fig-muted, #56655d); }
svg text { font-family: Cantarell, ui-sans-serif, system-ui, sans-serif; fill: var(--fig-ink, #15211b); }
svg .t { font-size: 14px; }
svg .small { font-size: 12.5px; fill: var(--fig-muted, #56655d); }
svg .tiny { font-size: 11.5px; fill: var(--fig-muted, #56655d); letter-spacing: .02em; }
svg .label { font-size: 14.5px; }
svg .label-strong { font-size: 14px; font-weight: 700; }
svg .title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
svg .display { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
svg .num { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; fill: var(--fig-accent, #0b6b63); letter-spacing: .04em; }
svg .mono { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
svg .mono-strong { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; }
svg .accent { fill: var(--fig-accent, #0b6b63); }
svg .warn { fill: var(--fig-warn, #985a00); }
svg .bad { fill: var(--fig-bad, #a43a31); }
svg .muted { fill: var(--fig-muted, #56655d); }
svg .ink { fill: var(--fig-ink, #15211b); }
svg .panel-label { font-size: 12px; font-weight: 700; fill: var(--fig-wall-ink, #e6efe9); }
svg .panel-small { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: var(--fig-wall-muted, #93a69c); }
</style>

<rect class="bg" width="960" height="560"/>
<rect width="960" height="560" fill="url(#ui-dots)" opacity=".55"/>
<text class="mono" x="52" y="38" text-anchor="start" >TWO PAGES</text><text class="small" x="908" y="38" text-anchor="end" >drawing versus editing</text><rect class="surface" x="58" y="76" width="390" height="380" rx="6"/><text class="label-strong" x="74" y="102" text-anchor="start" >Tablet client</text><text class="mono" x="74" y="120" text-anchor="start" >frontend/client/</text><rect class="wall" x="90" y="144" width="326" height="238" rx="4"/><rect class="surface-accent" x="116" y="170" width="126" height="92" rx="2"/><rect class="surface-accent" x="250" y="170" width="126" height="92" rx="2"/><rect class="surface-warn" x="116" y="270" width="260" height="84" rx="2"/><text class="label-strong" x="130" y="196" text-anchor="start" >canvas</text><text class="small" x="130" y="214" text-anchor="start" >stills</text><text class="label-strong" x="264" y="196" text-anchor="start" >canvas</text><text class="small" x="264" y="214" text-anchor="start" >stills</text><text class="label-strong" x="130" y="300" text-anchor="start" >video element</text><text class="small" x="130" y="318" text-anchor="start" >clipped by the same matrix</text><text class="mono" x="74" y="410" text-anchor="start" >persisted wall</text><text class="small" x="74" y="430" text-anchor="start" >restored on stop or close</text><rect class="surface" x="512" y="76" width="390" height="380" rx="6"/><text class="label-strong" x="528" y="102" text-anchor="start" >Operator workspace</text><text class="mono" x="528" y="120" text-anchor="start" >frontend/controller/physical</text><rect class="wall" x="528" y="144" width="230" height="230" rx="4"/><text class="panel-label" x="544" y="170" text-anchor="start" >stage</text><text class="panel-small" x="544" y="188" text-anchor="start" >SVG · layout geometry</text><rect class="surface-accent" x="544" y="206" width="96" height="64" rx="2"/><rect class="surface-accent" x="654" y="206" width="88" height="64" rx="2"/><rect class="surface-2" x="544" y="284" width="198" height="72" rx="2"/><text class="small" x="560" y="310" text-anchor="start" >selection</text><text class="tiny" x="560" y="328" text-anchor="start" >draft · undo</text><rect class="surface-2" x="772" y="144" width="114" height="38" rx="2"/><text class="small" x="786" y="168" text-anchor="start" >Images</text><rect class="surface-2" x="772" y="190" width="114" height="38" rx="2"/><text class="small" x="786" y="214" text-anchor="start" >Tablets</text><rect class="surface-accent" x="772" y="236" width="114" height="38" rx="2"/><text class="small" x="786" y="260" text-anchor="start" >Arrange</text><rect class="surface-2" x="772" y="282" width="114" height="38" rx="2"/><text class="small" x="786" y="306" text-anchor="start" >Saved</text><rect class="surface-2" x="772" y="328" width="114" height="38" rx="2"/><text class="small" x="786" y="352" text-anchor="start" >Settings</text><text class="mono" x="528" y="410" text-anchor="start" >draft is local until Apply</text><text class="small" x="528" y="430" text-anchor="start" >one visible panel</text><rect class="surface-accent" x="58" y="484" width="844" height="50" rx="3"/><text class="mono" x="76" y="514" text-anchor="start" >shared contract: HTTP commands + WebSocket pushes + ETags + the persisted wall</text>
</svg>
