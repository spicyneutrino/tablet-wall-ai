<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="geom-title geom-desc">
<title id="geom-title">Every pixel crosses a chain of coordinate spaces from source pixels to panel millimetres.</title>
<desc id="geom-desc">Every pixel crosses a chain of coordinate spaces from source pixels to panel millimetres.</desc>
<defs>
  <marker id="geom-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-muted, #56655d)"/>
  </marker>
  <pattern id="geom-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="var(--fig-dot, #d6e0d9)"/>
  </pattern>
</defs>

<style>
svg .bg { fill: var(--fig-bg, #f6f8f4); }
svg .surface { fill: var(--fig-surface, #ffffff); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-2 { fill: var(--fig-surface-2, #eef3ef); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-accent { fill: var(--fig-accent-soft, #dff1ec); stroke: var(--fig-accent, #0b6b63); stroke-width: 1.4; }
svg .surface-warn { fill: var(--fig-warn-soft, #f6ead8); stroke: var(--fig-warn, #985a00); stroke-width: 1.2; }
svg .surface-bad { fill: var(--fig-bad-soft, #f6e1df); stroke: var(--fig-bad, #a43a31); stroke-width: 1.2; }
svg .wall { fill: var(--fig-wall, #101b17); stroke: var(--fig-wall-line, #2b3b34); stroke-width: 1.2; }
svg .line { stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .line-strong { stroke: var(--fig-line-strong, #9fb0a6); stroke-width: 1.6; }
svg .arrow { stroke: var(--fig-muted, #56655d); stroke-width: 1.5; fill: none; }
svg .arrow-accent { stroke: var(--fig-accent, #0b6b63); stroke-width: 1.8; fill: none; }
svg .arrow-warn { stroke: var(--fig-warn, #985a00); stroke-width: 1.6; fill: none; }
svg .dot { fill: var(--fig-accent, #0b6b63); }
svg .dot-warn { fill: var(--fig-warn, #985a00); }
svg .dot-bad { fill: var(--fig-bad, #a43a31); }
svg .dot-muted { fill: var(--fig-muted, #56655d); }
svg text { font-family: Cantarell, ui-sans-serif, system-ui, sans-serif; fill: var(--fig-ink, #15211b); }
svg .t { font-size: 14px; }
svg .small { font-size: 12.5px; fill: var(--fig-muted, #56655d); }
svg .tiny { font-size: 11.5px; fill: var(--fig-muted, #56655d); letter-spacing: .02em; }
svg .label { font-size: 14.5px; }
svg .label-strong { font-size: 14px; font-weight: 700; }
svg .title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
svg .display { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
svg .num { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; fill: var(--fig-accent, #0b6b63); letter-spacing: .04em; }
svg .mono { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
svg .mono-strong { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; }
svg .accent { fill: var(--fig-accent, #0b6b63); }
svg .warn { fill: var(--fig-warn, #985a00); }
svg .bad { fill: var(--fig-bad, #a43a31); }
svg .muted { fill: var(--fig-muted, #56655d); }
svg .ink { fill: var(--fig-ink, #15211b); }
svg .panel-label { font-size: 12px; font-weight: 700; fill: var(--fig-wall-ink, #e6efe9); }
svg .panel-small { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: var(--fig-wall-muted, #93a69c); }
</style>

<rect class="bg" width="960" height="560"/>
<rect width="960" height="560" fill="url(#geom-dots)" opacity=".55"/>
<text class="mono" x="52" y="38" text-anchor="start" >COORDINATE SPACES</text><text class="small" x="908" y="38" text-anchor="end" >one owner for each transform</text><rect class="surface" x="58" y="86" width="338" height="300" rx="6"/><text class="label-strong" x="74" y="112" text-anchor="start" >Panel body</text><rect class="wall" x="86" y="138" width="282" height="206" rx="4"/><rect class="surface-accent" x="128" y="170" width="198" height="142" rx="2"/><text class="label-strong" x="150" y="202" text-anchor="start" >active panel</text><text class="mono" x="150" y="222" text-anchor="start" >P: 0,0 → w,h</text><line class="line-strong" x1="86" y1="170" x2="128" y2="170" /><line class="line-strong" x1="326" y1="312" x2="368" y2="312" /><text class="tiny" x="92" y="158" text-anchor="start" >bezel</text><text class="small" x="240" y="336" text-anchor="middle" >body B</text><text class="small" x="92" y="362" text-anchor="start" >W: wall millimetres, audience view</text><rect class="surface" x="444" y="92" width="280" height="34" rx="2"/><text class="num" x="456" y="114" text-anchor="start" >W</text><text class="label-strong" x="486" y="114" text-anchor="start" >wall mm</text><text class="small" x="600" y="114" text-anchor="start" >audience view</text><line class="line" x1="557" y1="126" x2="557" y2="136" /><rect class="surface-2" x="444" y="136" width="280" height="34" rx="2"/><text class="num" x="456" y="158" text-anchor="start" >B</text><text class="label-strong" x="486" y="158" text-anchor="start" >body mm</text><text class="small" x="600" y="158" text-anchor="start" >centred on tablet</text><line class="line" x1="557" y1="170" x2="557" y2="180" /><rect class="surface" x="444" y="180" width="280" height="34" rx="2"/><text class="num" x="456" y="202" text-anchor="start" >P</text><text class="label-strong" x="486" y="202" text-anchor="start" >panel mm</text><text class="small" x="600" y="202" text-anchor="start" >active origin</text><line class="line" x1="557" y1="214" x2="557" y2="224" /><rect class="surface-2" x="444" y="224" width="280" height="34" rx="2"/><text class="num" x="456" y="246" text-anchor="start" >C</text><text class="label-strong" x="486" y="246" text-anchor="start" >CSS px</text><text class="small" x="600" y="246" text-anchor="start" >calibrated viewport</text><line class="line" x1="557" y1="258" x2="557" y2="268" /><rect class="surface" x="444" y="268" width="280" height="34" rx="2"/><text class="num" x="456" y="290" text-anchor="start" >D</text><text class="label-strong" x="486" y="290" text-anchor="start" >backing px</text><text class="small" x="600" y="290" text-anchor="start" >DPR applied</text><line class="line" x1="557" y1="302" x2="557" y2="312" /><rect class="surface-2" x="444" y="312" width="280" height="34" rx="2"/><text class="num" x="456" y="334" text-anchor="start" >N</text><text class="label-strong" x="486" y="334" text-anchor="start" >normalized</text><text class="small" x="600" y="334" text-anchor="start" >upright source 0..1</text><rect class="surface-accent" x="58" y="404" width="852" height="128" rx="4"/><rect class="surface" x="76" y="420" width="130" height="38" rx="2"/><text class="num" x="86" y="438" text-anchor="start" >N</text><text class="label-strong" x="110" y="438" text-anchor="start" >source</text><rect class="surface" x="280" y="420" width="130" height="38" rx="2"/><text class="num" x="290" y="438" text-anchor="start" >P</text><text class="label-strong" x="314" y="438" text-anchor="start" >panel mm</text><rect class="surface" x="490" y="420" width="130" height="38" rx="2"/><text class="num" x="500" y="438" text-anchor="start" >C</text><text class="label-strong" x="524" y="438" text-anchor="start" >CSS px</text><rect class="surface" x="700" y="420" width="130" height="38" rx="2"/><text class="num" x="710" y="438" text-anchor="start" >D</text><text class="label-strong" x="734" y="438" text-anchor="start" >backing px</text><line class="arrow" x1="206" y1="439" x2="264" y2="439" marker-end="url(#geom-arrow)"/><text class="mono-strong" x="235" y="432" text-anchor="middle" >G</text><line class="arrow" x1="410" y1="439" x2="468" y2="439" marker-end="url(#geom-arrow)"/><text class="mono-strong" x="439" y="432" text-anchor="middle" >U⁻¹</text><line class="arrow" x1="620" y1="439" x2="678" y2="439" marker-end="url(#geom-arrow)"/><text class="mono-strong" x="649" y="432" text-anchor="middle" >DPR</text><text class="tiny" x="76" y="476" text-anchor="start" >G = G_N_to_P (server) · U⁻¹ = inverse(U_C_to_P) (client) · DPR = backing scale (device)</text><text class="mono-strong" x="76" y="500" text-anchor="start" >product:  backingScale × inverse(U_C_to_P) × G_N_to_P × scale(1 / w, 1 / h)</text><text class="small" x="76" y="520" text-anchor="start" >Apply the product right to left. The chain above is the same order: N → P → C → D.</text>
</svg>
