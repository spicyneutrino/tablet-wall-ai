<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="commit-title commit-desc">
<title id="commit-title">A wall write commits to SQLite before memory and delivery change.</title>
<desc id="commit-desc">A wall write commits to SQLite before memory and delivery change.</desc>
<defs>
  <marker id="commit-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-muted, #56655d)"/>
  </marker>
  <pattern id="commit-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="var(--fig-dot, #d6e0d9)"/>
  </pattern>
</defs>

<style>
svg .bg { fill: var(--fig-bg, #f6f8f4); }
svg .surface { fill: var(--fig-surface, #ffffff); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-2 { fill: var(--fig-surface-2, #eef3ef); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-accent { fill: var(--fig-accent-soft, #dff1ec); stroke: var(--fig-accent, #0b6b63); stroke-width: 1.4; }
svg .surface-warn { fill: var(--fig-warn-soft, #f6ead8); stroke: var(--fig-warn, #985a00); stroke-width: 1.2; }
svg .surface-bad { fill: var(--fig-bad-soft, #f6e1df); stroke: var(--fig-bad, #a43a31); stroke-width: 1.2; }
svg .wall { fill: var(--fig-wall, #101b17); stroke: var(--fig-wall-line, #2b3b34); stroke-width: 1.2; }
svg .line { stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .line-strong { stroke: var(--fig-line-strong, #9fb0a6); stroke-width: 1.6; }
svg .arrow { stroke: var(--fig-muted, #56655d); stroke-width: 1.5; fill: none; }
svg .arrow-accent { stroke: var(--fig-accent, #0b6b63); stroke-width: 1.8; fill: none; }
svg .arrow-warn { stroke: var(--fig-warn, #985a00); stroke-width: 1.6; fill: none; }
svg .dot { fill: var(--fig-accent, #0b6b63); }
svg .dot-warn { fill: var(--fig-warn, #985a00); }
svg .dot-bad { fill: var(--fig-bad, #a43a31); }
svg .dot-muted { fill: var(--fig-muted, #56655d); }
svg text { font-family: Cantarell, ui-sans-serif, system-ui, sans-serif; fill: var(--fig-ink, #15211b); }
svg .t { font-size: 14px; }
svg .small { font-size: 12.5px; fill: var(--fig-muted, #56655d); }
svg .tiny { font-size: 11.5px; fill: var(--fig-muted, #56655d); letter-spacing: .02em; }
svg .label { font-size: 14.5px; }
svg .label-strong { font-size: 14px; font-weight: 700; }
svg .title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
svg .display { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
svg .num { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; fill: var(--fig-accent, #0b6b63); letter-spacing: .04em; }
svg .mono { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
svg .mono-strong { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; }
svg .accent { fill: var(--fig-accent, #0b6b63); }
svg .warn { fill: var(--fig-warn, #985a00); }
svg .bad { fill: var(--fig-bad, #a43a31); }
svg .muted { fill: var(--fig-muted, #56655d); }
svg .ink { fill: var(--fig-ink, #15211b); }
svg .panel-label { font-size: 12px; font-weight: 700; fill: var(--fig-wall-ink, #e6efe9); }
svg .panel-small { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: var(--fig-wall-muted, #93a69c); }
</style>

<rect class="bg" width="960" height="560"/>
<rect width="960" height="560" fill="url(#commit-dots)" opacity=".55"/>
<text class="mono" x="52" y="38" text-anchor="start" >COMMIT PATH</text><text class="small" x="908" y="38" text-anchor="end" >write-ahead, then broadcast</text><rect class="surface" x="70" y="88" width="330" height="58" rx="4"/><text class="num" x="88" y="111" text-anchor="start" >1</text><text class="label-strong" x="116" y="111" text-anchor="start" >Controller PUT</text><text class="small" x="116" y="130" text-anchor="start" >If-Match: current ETag</text><line class="arrow" x1="235" y1="146" x2="235" y2="168" marker-end="url(#commit-arrow)"/><rect class="surface" x="70" y="170" width="330" height="58" rx="4"/><text class="num" x="88" y="193" text-anchor="start" >2</text><text class="label-strong" x="116" y="193" text-anchor="start" >Copy + revision</text><text class="small" x="116" y="212" text-anchor="start" >draft is applied to a copy</text><line class="arrow" x1="235" y1="228" x2="235" y2="250" marker-end="url(#commit-arrow)"/><rect class="surface" x="70" y="252" width="330" height="58" rx="4"/><text class="num" x="88" y="275" text-anchor="start" >3</text><text class="label-strong" x="116" y="275" text-anchor="start" >SQLite commit</text><text class="small" x="116" y="294" text-anchor="start" >save_state() returns</text><line class="arrow" x1="235" y1="310" x2="235" y2="332" marker-end="url(#commit-arrow)"/><rect class="surface" x="70" y="334" width="330" height="58" rx="4"/><text class="num" x="88" y="357" text-anchor="start" >4</text><text class="label-strong" x="116" y="357" text-anchor="start" >Reapply to live wall</text><text class="small" x="116" y="376" text-anchor="start" >same change, same revision</text><line class="arrow" x1="235" y1="392" x2="235" y2="414" marker-end="url(#commit-arrow)"/><rect class="surface" x="70" y="416" width="330" height="58" rx="4"/><text class="num" x="88" y="439" text-anchor="start" >5</text><text class="label-strong" x="116" y="439" text-anchor="start" >Broadcast</text><text class="small" x="116" y="458" text-anchor="start" >snapshots and render frames</text><rect class="surface-2" x="470" y="88" width="196" height="140" rx="4"/><text class="label-strong" x="486" y="112" text-anchor="start" >On success</text><text class="mono" x="486" y="134" text-anchor="start" >revision +1</text><text class="mono" x="486" y="152" text-anchor="start" >new ETag</text><text class="small" x="486" y="170" text-anchor="start" >memory == disk</text><rect class="surface-warn" x="470" y="252" width="196" height="140" rx="4"/><text class="label-strong" x="486" y="276" text-anchor="start" >Write fails</text><text class="small" x="486" y="298" text-anchor="start" >no memory change</text><text class="small" x="486" y="316" text-anchor="start" >no broadcast</text><text class="small" x="486" y="334" text-anchor="start" >old state stays true</text><rect class="surface-accent" x="470" y="416" width="196" height="74" rx="4"/><text class="label-strong" x="486" y="440" text-anchor="start" >Broadcast fails</text><text class="small" x="486" y="460" text-anchor="start" >committed state still wins</text><text class="small" x="486" y="478" text-anchor="start" >client retries with ETag</text><rect class="surface" x="724" y="88" width="170" height="96" rx="4"/><text class="label-strong" x="740" y="112" text-anchor="start" >SQLite</text><text class="mono" x="740" y="132" text-anchor="start" >wall_state row</text><text class="small" x="740" y="150" text-anchor="start" >transactional</text><text class="small" x="740" y="168" text-anchor="start" >one file</text><rect class="surface" x="724" y="212" width="170" height="96" rx="4"/><text class="label-strong" x="740" y="236" text-anchor="start" >Tablets</text><text class="mono" x="740" y="256" text-anchor="start" >render frames</text><text class="small" x="740" y="274" text-anchor="start" >complete state</text><text class="small" x="740" y="292" text-anchor="start" >generation + revision</text><line class="arrow" x1="400" y1="117" x2="460" y2="117" marker-end="url(#commit-arrow)"/><line class="arrow" x1="666" y1="117" x2="714" y2="117" marker-end="url(#commit-arrow)"/><line class="arrow" x1="666" y1="260" x2="714" y2="260" marker-end="url(#commit-arrow)"/><text class="tiny" x="410" y="108" text-anchor="start" >disk</text><text class="tiny" x="668" y="108" text-anchor="start" >row</text><text class="tiny" x="668" y="252" text-anchor="start" >push</text><text class="small" x="70" y="510" text-anchor="start" >A missing or stale If-Match returns 428 or 412 before this path.</text>
</svg>
