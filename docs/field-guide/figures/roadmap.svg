<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="road-title road-desc">
<title id="road-title">Software phases are closed while all eight hardware gates remain open.</title>
<desc id="road-desc">Software phases are closed while all eight hardware gates remain open.</desc>
<defs>
  <marker id="road-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-muted, #56655d)"/>
  </marker>
  <pattern id="road-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="var(--fig-dot, #d6e0d9)"/>
  </pattern>
</defs>

<style>
svg .bg { fill: var(--fig-bg, #f6f8f4); }
svg .surface { fill: var(--fig-surface, #ffffff); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-2 { fill: var(--fig-surface-2, #eef3ef); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-accent { fill: var(--fig-accent-soft, #dff1ec); stroke: var(--fig-accent, #0b6b63); stroke-width: 1.4; }
svg .surface-warn { fill: var(--fig-warn-soft, #f6ead8); stroke: var(--fig-warn, #985a00); stroke-width: 1.2; }
svg .surface-bad { fill: var(--fig-bad-soft, #f6e1df); stroke: var(--fig-bad, #a43a31); stroke-width: 1.2; }
svg .wall { fill: var(--fig-wall, #101b17); stroke: var(--fig-wall-line, #2b3b34); stroke-width: 1.2; }
svg .line { stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .line-strong { stroke: var(--fig-line-strong, #9fb0a6); stroke-width: 1.6; }
svg .arrow { stroke: var(--fig-muted, #56655d); stroke-width: 1.5; fill: none; }
svg .arrow-accent { stroke: var(--fig-accent, #0b6b63); stroke-width: 1.8; fill: none; }
svg .arrow-warn { stroke: var(--fig-warn, #985a00); stroke-width: 1.6; fill: none; }
svg .dot { fill: var(--fig-accent, #0b6b63); }
svg .dot-warn { fill: var(--fig-warn, #985a00); }
svg .dot-bad { fill: var(--fig-bad, #a43a31); }
svg .dot-muted { fill: var(--fig-muted, #56655d); }
svg text { font-family: Cantarell, ui-sans-serif, system-ui, sans-serif; fill: var(--fig-ink, #15211b); }
svg .t { font-size: 14px; }
svg .small { font-size: 12.5px; fill: var(--fig-muted, #56655d); }
svg .tiny { font-size: 11.5px; fill: var(--fig-muted, #56655d); letter-spacing: .02em; }
svg .label { font-size: 14.5px; }
svg .label-strong { font-size: 14px; font-weight: 700; }
svg .title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
svg .display { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
svg .num { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; fill: var(--fig-accent, #0b6b63); letter-spacing: .04em; }
svg .mono { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
svg .mono-strong { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; }
svg .accent { fill: var(--fig-accent, #0b6b63); }
svg .warn { fill: var(--fig-warn, #985a00); }
svg .bad { fill: var(--fig-bad, #a43a31); }
svg .muted { fill: var(--fig-muted, #56655d); }
svg .ink { fill: var(--fig-ink, #15211b); }
svg .panel-label { font-size: 12px; font-weight: 700; fill: var(--fig-wall-ink, #e6efe9); }
svg .panel-small { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: var(--fig-wall-muted, #93a69c); }
</style>

<rect class="bg" width="960" height="560"/>
<rect width="960" height="560" fill="url(#road-dots)" opacity=".55"/>
<text class="mono" x="52" y="38" text-anchor="start" >DELIVERY PHASES</text><text class="small" x="908" y="38" text-anchor="end" >software closed, hardware open</text><rect class="surface-accent" x="56" y="84" width="198" height="100" rx="4"/><text class="num" x="70" y="112" text-anchor="start" >P0</text><text class="label-strong" x="70" y="138" text-anchor="start" >baseline</text><text class="small" x="70" y="162" text-anchor="start" >done</text><rect class="surface-accent" x="278" y="84" width="198" height="100" rx="4"/><text class="num" x="292" y="112" text-anchor="start" >R1</text><text class="label-strong" x="292" y="138" text-anchor="start" >upload + show</text><text class="small" x="292" y="162" text-anchor="start" >done</text><rect class="surface-accent" x="500" y="84" width="198" height="100" rx="4"/><text class="num" x="514" y="112" text-anchor="start" >R2</text><text class="label-strong" x="514" y="138" text-anchor="start" >calibration + editor</text><text class="small" x="514" y="162" text-anchor="start" >done</text><rect class="surface-accent" x="722" y="84" width="198" height="100" rx="4"/><text class="num" x="736" y="112" text-anchor="start" >R3</text><text class="label-strong" x="736" y="138" text-anchor="start" >clock + hard cuts</text><text class="small" x="736" y="162" text-anchor="start" >done</text><rect class="surface-accent" x="56" y="216" width="198" height="100" rx="4"/><text class="num" x="70" y="244" text-anchor="start" >R4</text><text class="label-strong" x="70" y="270" text-anchor="start" >native video</text><text class="small" x="70" y="294" text-anchor="start" >done</text><rect class="surface-accent" x="278" y="216" width="198" height="100" rx="4"/><text class="num" x="292" y="244" text-anchor="start" >R5</text><text class="label-strong" x="292" y="270" text-anchor="start" >field readiness</text><text class="small" x="292" y="294" text-anchor="start" >done</text><rect class="surface-warn" x="500" y="216" width="198" height="100" rx="4"/><text class="num" x="514" y="244" text-anchor="start" >R6</text><text class="label-strong" x="514" y="270" text-anchor="start" >segmented / live</text><text class="small" x="514" y="294" text-anchor="start" >not started</text><rect class="surface-warn" x="56" y="360" width="846" height="96" rx="4"/><text class="label-strong" x="72" y="386" text-anchor="start" >Open gates</text><text class="small" x="72" y="408" text-anchor="start" >optical still cuts · physical video decode/suspend/recovery · iOS Safari · mixed-model calibration</text><text class="small" x="72" y="428" text-anchor="start" >installed CA trust + origin migration · real Wi-Fi/OS · kiosk · sustained soak</text><text class="mono-strong" x="72" y="448" text-anchor="start" >all eight MISSING</text><rect class="surface-2" x="56" y="478" width="846" height="52" rx="3"/><text class="mono" x="72" y="508" text-anchor="start" >Console: phase 1 done · phase 2 done · phase 3 upload/legacy retirement not started</text>
</svg>
