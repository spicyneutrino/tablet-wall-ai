<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="media-title media-desc">
<title id="media-title">Bytes become visible only after validation, durable publication, and a ready row.</title>
<desc id="media-desc">Bytes become visible only after validation, durable publication, and a ready row.</desc>
<defs>
  <marker id="media-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-muted, #56655d)"/>
  </marker>
  <pattern id="media-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="var(--fig-dot, #d6e0d9)"/>
  </pattern>
</defs>

<style>
svg .bg { fill: var(--fig-bg, #f6f8f4); }
svg .surface { fill: var(--fig-surface, #ffffff); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-2 { fill: var(--fig-surface-2, #eef3ef); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-accent { fill: var(--fig-accent-soft, #dff1ec); stroke: var(--fig-accent, #0b6b63); stroke-width: 1.4; }
svg .surface-warn { fill: var(--fig-warn-soft, #f6ead8); stroke: var(--fig-warn, #985a00); stroke-width: 1.2; }
svg .surface-bad { fill: var(--fig-bad-soft, #f6e1df); stroke: var(--fig-bad, #a43a31); stroke-width: 1.2; }
svg .wall { fill: var(--fig-wall, #101b17); stroke: var(--fig-wall-line, #2b3b34); stroke-width: 1.2; }
svg .line { stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .line-strong { stroke: var(--fig-line-strong, #9fb0a6); stroke-width: 1.6; }
svg .arrow { stroke: var(--fig-muted, #56655d); stroke-width: 1.5; fill: none; }
svg .arrow-accent { stroke: var(--fig-accent, #0b6b63); stroke-width: 1.8; fill: none; }
svg .arrow-warn { stroke: var(--fig-warn, #985a00); stroke-width: 1.6; fill: none; }
svg .dot { fill: var(--fig-accent, #0b6b63); }
svg .dot-warn { fill: var(--fig-warn, #985a00); }
svg .dot-bad { fill: var(--fig-bad, #a43a31); }
svg .dot-muted { fill: var(--fig-muted, #56655d); }
svg text { font-family: Cantarell, ui-sans-serif, system-ui, sans-serif; fill: var(--fig-ink, #15211b); }
svg .t { font-size: 14px; }
svg .small { font-size: 12.5px; fill: var(--fig-muted, #56655d); }
svg .tiny { font-size: 11.5px; fill: var(--fig-muted, #56655d); letter-spacing: .02em; }
svg .label { font-size: 14.5px; }
svg .label-strong { font-size: 14px; font-weight: 700; }
svg .title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
svg .display { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
svg .num { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; fill: var(--fig-accent, #0b6b63); letter-spacing: .04em; }
svg .mono { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
svg .mono-strong { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; }
svg .accent { fill: var(--fig-accent, #0b6b63); }
svg .warn { fill: var(--fig-warn, #985a00); }
svg .bad { fill: var(--fig-bad, #a43a31); }
svg .muted { fill: var(--fig-muted, #56655d); }
svg .ink { fill: var(--fig-ink, #15211b); }
svg .panel-label { font-size: 12px; font-weight: 700; fill: var(--fig-wall-ink, #e6efe9); }
svg .panel-small { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: var(--fig-wall-muted, #93a69c); }
</style>

<rect class="bg" width="960" height="560"/>
<rect width="960" height="560" fill="url(#media-dots)" opacity=".55"/>
<text class="mono" x="52" y="38" text-anchor="start" >MEDIA PUBLICATION</text><text class="small" x="908" y="38" text-anchor="end" >bytes before a ready row</text><rect class="surface" x="60" y="96" width="150" height="78" rx="4"/><text class="mono-strong" x="72" y="122" text-anchor="start" >POST /uploads</text><text class="small" x="72" y="144" text-anchor="start" >admit · size · type</text><line class="arrow" x1="210" y1="135" x2="236" y2="135" marker-end="url(#media-arrow)"/><rect class="surface" x="236" y="96" width="150" height="78" rx="4"/><text class="mono-strong" x="248" y="122" text-anchor="start" >staging</text><text class="small" x="248" y="144" text-anchor="start" >one job, own dir</text><line class="arrow" x1="386" y1="135" x2="412" y2="135" marker-end="url(#media-arrow)"/><rect class="surface" x="412" y="96" width="150" height="78" rx="4"/><text class="mono-strong" x="424" y="122" text-anchor="start" >worker</text><text class="small" x="424" y="144" text-anchor="start" >normalize / remux</text><line class="arrow" x1="562" y1="135" x2="588" y2="135" marker-end="url(#media-arrow)"/><rect class="surface" x="588" y="96" width="150" height="78" rx="4"/><text class="mono-strong" x="600" y="122" text-anchor="start" >validate</text><text class="small" x="600" y="144" text-anchor="start" >re-hash · dimensions</text><line class="arrow" x1="738" y1="135" x2="764" y2="135" marker-end="url(#media-arrow)"/><rect class="surface" x="764" y="96" width="150" height="78" rx="4"/><text class="mono-strong" x="776" y="122" text-anchor="start" >publish</text><text class="small" x="776" y="144" text-anchor="start" >link immutable object</text><rect class="surface-2" x="60" y="222" width="854" height="90" rx="4"/><text class="label-strong" x="76" y="248" text-anchor="start" >parent re-checks the worker</text><text class="small" x="76" y="270" text-anchor="start" >role · mime · pixel dimensions · video facts · output hash</text><text class="small" x="76" y="292" text-anchor="start" >a worker result is not trusted until the parent verifies the bytes</text><rect class="surface-accent" x="170" y="360" width="250" height="92" rx="4"/><text class="mono-strong" x="188" y="386" text-anchor="start" >objects/&lt;sha&gt;/</text><text class="small" x="188" y="408" text-anchor="start" >content-addressed</text><text class="small" x="188" y="426" text-anchor="start" >atomic link, never replace</text><rect class="surface-accent" x="540" y="360" width="250" height="92" rx="4"/><text class="mono-strong" x="558" y="386" text-anchor="start" >SQLite ready row</text><text class="small" x="558" y="408" text-anchor="start" >one transaction</text><text class="small" x="558" y="426" text-anchor="start" >points at durable bytes</text><line class="arrow" x1="300" y1="318" x2="295" y2="350" marker-end="url(#media-arrow)"/><line class="arrow" x1="660" y1="318" x2="665" y2="350" marker-end="url(#media-arrow)"/><text class="small" x="190" y="492" text-anchor="start" >crash between object and row</text><text class="small" x="190" y="510" text-anchor="start" >unlisted object, never served</text><text class="small" x="560" y="492" text-anchor="start" >crash during upload</text><text class="small" x="560" y="510" text-anchor="start" >staging removed on next cleanup</text>
</svg>
