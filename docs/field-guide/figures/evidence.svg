svg .t { font-size: 14px; }
svg .small { font-size: 12.5px; fill: var(--fig-muted, #56655d); }
svg .tiny { font-size: 11.5px; fill: var(--fig-muted, #56655d); letter-spacing: .02em; }
svg .label { font-size: 14.5px; }
svg .label-strong { font-size: 14px; font-weight: 700; }
svg .title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
svg .display { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
svg .num { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; fill: var(--fig-accent, #0b6b63); letter-spacing: .04em; }
svg .mono { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
svg .mono-strong { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; }
svg .accent { fill: var(--fig-accent, #0b6b63); }
svg .warn { fill: var(--fig-warn, #985a00); }
svg .bad { fill: var(--fig-bad, #a43a31); }
svg .muted { fill: var(--fig-muted, #56655d); }
svg .ink { fill: var(--fig-ink, #15211b); }
svg .panel-label { font-size: 12px; font-weight: 700; fill: var(--fig-wall-ink, #e6efe9); }
svg .panel-small { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: var(--fig-wall-muted, #93a69c); }
</style>

<rect class="bg" width="960" height="560"/>
<rect width="960" height="560" fill="url(#ev-dots)" opacity=".55"/>
<text class="mono" x="52" y="38" text-anchor="start" >EVIDENCE LADDER</text><text class="small" x="908" y="38" text-anchor="end" >each layer proves a different claim</text><rect class="surface-2" x="400.0" y="88" width="100.0" height="48" rx="3"/><text class="label-strong" x="414.0" y="109" text-anchor="start" >Unit + contract</text><text class="small" x="414.0" y="126" text-anchor="start" >995 passed</text><rect class="surface-2" x="328.0" y="158" width="190.0" height="48" rx="3"/><text class="label-strong" x="342.0" y="179" text-anchor="start" >Node client</text><text class="small" x="342.0" y="196" text-anchor="start" >drawing · view · wake lock</text><rect class="surface" x="255.99999999999997" y="228" width="280.0" height="48" rx="3"/><text class="label-strong" x="270.0" y="249" text-anchor="start" >Simulator</text><text class="small" x="270.0" y="266" text-anchor="start" >23 scenarios · 1,075 checks</text><rect class="surface-accent" x="184.0" y="298" width="370.0" height="48" rx="3"/><text class="label-strong" x="198.0" y="319" text-anchor="start" >Browser runner</text><text class="small" x="198.0" y="336" text-anchor="start" >real DOM · canvas · video</text><rect class="surface-warn" x="111.99999999999999" y="368" width="460.0" height="48" rx="3"/><text class="label-strong" x="125.99999999999999" y="389" text-anchor="start" >Hardware gate</text><text class="small" x="125.99999999999999" y="406" text-anchor="start" >camera · tablets · AP · soak</text><rect class="surface" x="620" y="88" width="290" height="126" rx="3"/><text class="label-strong" x="636" y="112" text-anchor="start" >What a pass proves</text><text class="small" x="636" y="134" text-anchor="start" >the code contract, or the DOM</text><text class="small" x="636" y="152" text-anchor="start" >it does not prove a panel</text><text class="small" x="636" y="170" text-anchor="start" >or a real radio</text><rect class="surface" x="620" y="238" width="290" height="126" rx="3"/><text class="label-strong" x="636" y="262" text-anchor="start" >What a gate needs</text><text class="small" x="636" y="284" text-anchor="start" >equipment · operator</text><text class="small" x="636" y="302" text-anchor="start" >artifact hashes · signed row</text><text class="small" x="636" y="320" text-anchor="start" >unobserved intervals recorded</text><rect class="surface-warn" x="620" y="388" width="290" height="126" rx="3"/><text class="label-strong" x="636" y="412" text-anchor="start" >All eight gates</text><text class="small" x="636" y="434" text-anchor="start" >optical · decode/suspend · iOS</text><text class="small" x="636" y="452" text-anchor="start" >calibration · CA trust · Wi-Fi</text><text class="small" x="636" y="470" text-anchor="start" >kiosk · soak</text><text class="small" x="80" y="500" text-anchor="start" >A browser runner is not a hardware result. The kit records that boundary in every report.</text>
</svg>
