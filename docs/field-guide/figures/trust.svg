text class="small" x="342" y="382" text-anchor="start" >TLS internal · reference only</text><rect class="surface" x="680" y="76" width="222" height="330" rx="6"/><text class="label-strong" x="696" y="102" text-anchor="start" >Backend</text><text class="mono" x="696" y="120" text-anchor="start" >loopback :8000</text><rect class="surface-2" x="696" y="144" width="190" height="60" rx="3"/><text class="mono-strong" x="710" y="168" text-anchor="start" >Origin guard</text><text class="small" x="710" y="186" text-anchor="start" >CSRF fence, not auth</text><rect class="surface-2" x="696" y="220" width="190" height="60" rx="3"/><text class="mono-strong" x="710" y="244" text-anchor="start" >Upload admission</text><text class="small" x="710" y="262" text-anchor="start" >loopback or proxy</text><rect class="surface-2" x="696" y="296" width="190" height="60" rx="3"/><text class="mono-strong" x="710" y="320" text-anchor="start" >Asset safety</text><text class="small" x="710" y="338" text-anchor="start" >hash + O_NOFOLLOW</text><line class="arrow" x1="266" y1="220" x2="316" y2="220" marker-end="url(#trust-arrow)"/><text class="tiny" x="270" y="208" text-anchor="start" >TLS</text><line class="arrow" x1="626" y1="190" x2="670" y2="190" marker-end="url(#trust-arrow)"/><line class="arrow" x1="626" y1="300" x2="670" y2="300" marker-end="url(#trust-arrow)"/><rect class="surface-warn" x="56" y="420" width="846" height="94" rx="4"/><text class="label-strong" x="74" y="446" text-anchor="start" >Residual risks</text><text class="small" x="74" y="468" text-anchor="start" >public registration · no device pairing · shared proxy credential · reads are open</text><text class="small" x="74" y="490" text-anchor="start" >installed CA trust, real hotspot, and kiosk behavior remain MISSING</text>
