<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="lat-title lat-desc">
<title id="lat-title">The control loop and the glass have different latency budgets.</title>
<desc id="lat-desc">The control loop and the glass have different latency budgets.</desc>
<defs>
  <marker id="lat-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-muted, #56655d)"/>
  </marker>
  <pattern id="lat-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="var(--fig-dot, #d6e0d9)"/>
  </pattern>
</defs>

<style>
svg .bg { fill: var(--fig-bg, #f6f8f4); }
svg .surface { fill: var(--fig-surface, #ffffff); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
