class="tiny" x="820" y="450" text-anchor="end" >30 s</text><rect class="surface-warn" x="56" y="476" width="846" height="48" rx="3"/><text class="mono" x="72" y="506" text-anchor="start" >Software cut: p95 0.9–1.0 ms  ·  optical target: p95 ≤ 100 ms, max ≤ 250 ms  ·  optical gate MISSING</text>
</svg>
