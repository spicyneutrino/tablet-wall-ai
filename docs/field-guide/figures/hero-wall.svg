<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">A six-panel wall elevation with one source image and a future commit line.</title>
<desc id="hero-desc">A six-panel wall elevation with one source image and a future commit line.</desc>
<defs>
  <marker id="hero-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-muted, #56655d)"/>
  </marker>
  <pattern id="hero-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="var(--fig-dot, #d6e0d9)"/>
  </pattern>
</defs>

<style>
svg .bg { fill: var(--fig-bg, #f6f8f4); }
svg .surface { fill: var(--fig-surface, #ffffff); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-2 { fill: var(--fig-surface-2, #eef3ef); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-accent { fill: var(--fig-accent-soft, #dff1ec); stroke: var(--fig-accent, #0b6b63); stroke-width: 1.4; }
svg .surface-warn { fill: var(--fig-warn-soft, #f6ead8); stroke: var(--fig-warn, #985a00); stroke-width: 1.2; }
svg .surface-bad { fill: var(--fig-bad-soft, #f6e1df); stroke: var(--fig-bad, #a43a31); stroke-width: 1.2; }
svg .wall { fill: var(--fig-wall, #101b17); stroke: var(--fig-wall-line, #2b3b34); stroke-width: 1.2; }
svg .line { stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .line-strong { stroke: var(--fig-line-strong, #9fb0a6); stroke-width: 1.6; }
svg .arrow { stroke: var(--fig-muted, #56655d); stroke-width: 1.5; fill: none; }
svg .arrow-accent { stroke: var(--fig-accent, #0b6b63); stroke-width: 1.8; fill: none; }
svg .arrow-warn { stroke: var(--fig-warn, #985a00); stroke-width: 1.6; fill: none; }
svg .dot { fill: var(--fig-accent, #0b6b63); }
svg .dot-warn { fill: var(--fig-warn, #985a00); }
svg .dot-bad { fill: var(--fig-bad, #a43a31); }
svg .dot-muted { fill: var(--fig-muted, #56655d); }
svg text { font-family: Cantarell, ui-sans-serif, system-ui, sans-serif; fill: var(--fig-ink, #15211b); }
svg .t { font-size: 14px; }
svg .small { font-size: 12.5px; fill: var(--fig-muted, #56655d); }
svg .tiny { font-size: 11.5px; fill: var(--fig-muted, #56655d); letter-spacing: .02em; }
svg .label { font-size: 14.5px; }
svg .label-strong { font-size: 14px; font-weight: 700; }
svg .title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
svg .display { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
svg .num { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; fill: var(--fig-accent, #0b6b63); letter-spacing: .04em; }
svg .mono { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
svg .mono-strong { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; }
svg .accent { fill: var(--fig-accent, #0b6b63); }
svg .warn { fill: var(--fig-warn, #985a00); }
svg .bad { fill: var(--fig-bad, #a43a31); }
svg .muted { fill: var(--fig-muted, #56655d); }
svg .ink { fill: var(--fig-ink, #15211b); }
svg .panel-label { font-size: 12px; font-weight: 700; fill: var(--fig-wall-ink, #e6efe9); }
svg .panel-small { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: var(--fig-wall-muted, #93a69c); }
</style>

<rect class="bg" width="960" height="560"/>
<rect width="960" height="560" fill="url(#hero-dots)" opacity=".55"/>
<line class="line" x1="64" y1="44" x2="64" y2="54" /><text class="tiny" x="64" y="36" text-anchor="middle" >0</text><line class="line" x1="156" y1="44" x2="156" y2="54" /><text class="tiny" x="156" y="36" text-anchor="middle" >250</text><line class="line" x1="248" y1="44" x2="248" y2="54" /><text class="tiny" x="248" y="36" text-anchor="middle" >500</text><line class="line" x1="340" y1="44" x2="340" y2="54" /><text class="tiny" x="340" y="36" text-anchor="middle" >750</text><line class="line" x1="432" y1="44" x2="432" y2="54" /><text class="tiny" x="432" y="36" text-anchor="middle" >1000</text><line class="line" x1="524" y1="44" x2="524" y2="54" /><text class="tiny" x="524" y="36" text-anchor="middle" >1250</text><line class="line" x1="616" y1="44" x2="616" y2="54" /><text class="tiny" x="616" y="36" text-anchor="middle" >1500</text><line class="line" x1="708" y1="44" x2="708" y2="54" /><text class="tiny" x="708" y="36" text-anchor="middle" >1750</text><line class="line" x1="800" y1="44" x2="800" y2="54" /><text class="tiny" x="800" y="36" text-anchor="middle" >2000</text><text class="mono" x="64" y="22" text-anchor="start" >WALL ELEVATION / 2000 × 1000</text><text class="tiny" x="896" y="22" text-anchor="end" >AUDIENCE VIEW</text><rect class="wall" x="120" y="92" width="230" height="154" rx="4"/><rect class="wall" x="130" y="102" width="210" height="134" rx="2"/><text class="num" x="144" y="126" text-anchor="start" >#1</text><circle class="dot" cx="326" cy="120" r="3.5"/><line class="line" x1="144" y1="218" x2="326" y2="218" /><rect class="wall" x="360" y="92" width="230" height="154" rx="4"/><rect class="wall" x="370" y="102" width="210" height="134" rx="2"/><text class="num" x="384" y="126" text-anchor="start" >#2</text><circle class="dot" cx="566" cy="120" r="3.5"/><line class="line" x1="384" y1="218" x2="566" y2="218" /><rect class="wall" x="600" y="92" width="230" height="154" rx="4"/><rect class="wall" x="610" y="102" width="210" height="134" rx="2"/><text class="num" x="624" y="126" text-anchor="start" >#3</text><circle class="dot" cx="806" cy="120" r="3.5"/><line class="line" x1="624" y1="218" x2="806" y2="218" /><rect class="wall" x="120" y="264" width="230" height="154" rx="4"/><rect class="wall" x="130" y="274" width="210" height="134" rx="2"/><text class="num" x="144" y="298" text-anchor="start" >#4</text><circle class="dot" cx="326" cy="292" r="3.5"/><line class="line" x1="144" y1="390" x2="326" y2="390" /><rect class="wall" x="360" y="264" width="230" height="154" rx="4"/><rect class="wall" x="370" y="274" width="210" height="134" rx="2"/><text class="num" x="384" y="298" text-anchor="start" >#5</text><circle class="dot" cx="566" cy="292" r="3.5"/><line class="line" x1="384" y1="390" x2="566" y2="390" /><rect class="wall" x="600" y="264" width="230" height="154" rx="4"/><rect class="wall" x="610" y="274" width="210" height="134" rx="2"/><text class="num" x="624" y="298" text-anchor="start" >#6</text><circle class="dot" cx="806" cy="292" r="3.5"/><line class="line" x1="624" y1="390" x2="806" y2="390" /><path class="arrow-accent" d="M 78 350 C 82 180, 92 160, 112 160" /><circle class="dot" cx="78" cy="350" r="5"/><line class="line-strong" x1="820" y1="70" x2="820" y2="472" stroke-dasharray="3 5"/><path class="accent" d="M 812 70 L 828 70 L 820 84 Z" /><text class="mono-strong" x="836" y="88" text-anchor="start" >cut</text><text class="small" x="836" y="104" text-anchor="start" >t + 1000 ms</text><text class="mono-strong" x="64" y="500" text-anchor="start" >ONE SOURCE IMAGE</text><text class="small" x="64" y="518" text-anchor="start" >Each tablet draws only its slice of the same wall.</text><text class="mono-strong" x="896" y="500" text-anchor="end" >6 PANELS</text><text class="small" x="896" y="518" text-anchor="end" >geometry, not six copies</text>
</svg>
