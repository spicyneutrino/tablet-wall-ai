<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="proto-title proto-desc">
<title id="proto-title">Three protocol versions share HTTP and WebSocket transport but project different frames.</title>
<desc id="proto-desc">Three protocol versions share HTTP and WebSocket transport but project different frames.</desc>
<defs>
  <marker id="proto-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fig-muted, #56655d)"/>
  </marker>
  <pattern id="proto-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="var(--fig-dot, #d6e0d9)"/>
  </pattern>
</defs>

<style>
svg .bg { fill: var(--fig-bg, #f6f8f4); }
svg .surface { fill: var(--fig-surface, #ffffff); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-2 { fill: var(--fig-surface-2, #eef3ef); stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .surface-accent { fill: var(--fig-accent-soft, #dff1ec); stroke: var(--fig-accent, #0b6b63); stroke-width: 1.4; }
svg .surface-warn { fill: var(--fig-warn-soft, #f6ead8); stroke: var(--fig-warn, #985a00); stroke-width: 1.2; }
svg .surface-bad { fill: var(--fig-bad-soft, #f6e1df); stroke: var(--fig-bad, #a43a31); stroke-width: 1.2; }
svg .wall { fill: var(--fig-wall, #101b17); stroke: var(--fig-wall-line, #2b3b34); stroke-width: 1.2; }
svg .line { stroke: var(--fig-line, #ccd8d0); stroke-width: 1.2; }
svg .line-strong { stroke: var(--fig-line-strong, #9fb0a6); stroke-width: 1.6; }
svg .arrow { stroke: var(--fig-muted, #56655d); stroke-width: 1.5; fill: none; }
svg .arrow-accent { stroke: var(--fig-accent, #0b6b63); stroke-width: 1.8; fill: none; }
svg .arrow-warn { stroke: var(--fig-warn, #985a00); stroke-width: 1.6; fill: none; }
svg .dot { fill: var(--fig-accent, #0b6b63); }
svg .dot-warn { fill: var(--fig-warn, #985a00); }
svg .dot-bad { fill: var(--fig-bad, #a43a31); }
svg .dot-muted { fill: var(--fig-muted, #56655d); }
svg text { font-family: Cantarell, ui-sans-serif, system-ui, sans-serif; fill: var(--fig-ink, #15211b); }
svg .t { font-size: 14px; }
svg .small { font-size: 12.5px; fill: var(--fig-muted, #56655d); }
svg .tiny { font-size: 11.5px; fill: var(--fig-muted, #56655d); letter-spacing: .02em; }
svg .label { font-size: 14.5px; }
svg .label-strong { font-size: 14px; font-weight: 700; }
svg .title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
svg .display { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
svg .num { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; fill: var(--fig-accent, #0b6b63); letter-spacing: .04em; }
svg .mono { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
svg .mono-strong { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; }
svg .accent { fill: var(--fig-accent, #0b6b63); }
svg .warn { fill: var(--fig-warn, #985a00); }
svg .bad { fill: var(--fig-bad, #a43a31); }
svg .muted { fill: var(--fig-muted, #56655d); }
svg .ink { fill: var(--fig-ink, #15211b); }
svg .panel-label { font-size: 12px; font-weight: 700; fill: var(--fig-wall-ink, #e6efe9); }
svg .panel-small { font-family: 'Source Code Pro', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; fill: var(--fig-wall-muted, #93a69c); }
</style>

<rect class="bg" width="960" height="560"/>
<rect width="960" height="560" fill="url(#proto-dots)" opacity=".55"/>
<text class="mono" x="52" y="38" text-anchor="start" >PROTOCOL VERSIONS</text><text class="small" x="908" y="38" text-anchor="end" >same transport, different frame shapes</text><rect class="surface" x="58" y="76" width="276" height="300" rx="6"/><text class="display" x="74" y="104" text-anchor="start" >v1</text><text class="label-strong" x="74" y="126" text-anchor="start" >legacy client</text><line class="line" x1="74" y1="142" x2="318" y2="142" /><text class="tiny" x="74" y="172" text-anchor="start" >device frame</text><text class="mono-strong" x="74" y="194" text-anchor="start" >welcome + set_color</text><text class="small" x="74" y="220" text-anchor="start" >colour only</text><text class="tiny" x="74" y="258" text-anchor="start" >operator view</text><text class="mono" x="74" y="280" text-anchor="start" >device list only</text><text class="small" x="74" y="314" text-anchor="start" >byte-compatible</text><text class="tiny" x="74" y="332" text-anchor="start" >still served</text><rect class="surface" x="358" y="76" width="276" height="300" rx="6"/><text class="display" x="374" y="104" text-anchor="start" >v2</text><text class="label-strong" x="374" y="126" text-anchor="start" >legacy controller + client</text><line class="line" x1="374" y1="142" x2="618" y2="142" /><text class="tiny" x="374" y="172" text-anchor="start" >device frame</text><text class="mono-strong" x="374" y="194" text-anchor="start" >wall</text><text class="small" x="374" y="220" text-anchor="start" >placement + scene</text><text class="tiny" x="374" y="258" text-anchor="start" >operator view</text><text class="mono" x="374" y="280" text-anchor="start" >snapshot + wall_updated</text><text class="small" x="374" y="314" text-anchor="start" >capability downgrade</text><text class="tiny" x="374" y="332" text-anchor="start" >no unadvertised content</text><rect class="surface" x="658" y="76" width="276" height="300" rx="6"/><text class="display" x="674" y="104" text-anchor="start" >v3</text><text class="label-strong" x="674" y="126" text-anchor="start" >current client + v3 controller</text><line class="line" x1="674" y1="142" x2="918" y2="142" /><text class="tiny" x="674" y="172" text-anchor="start" >device frame</text><text class="mono-strong" x="674" y="194" text-anchor="start" >render</text><text class="small" x="674" y="220" text-anchor="start" >plan or calibration reason</text><text class="tiny" x="674" y="258" text-anchor="start" >operator view</text><text class="mono" x="674" y="280" text-anchor="start" >snapshot + config_updated</text><text class="small" x="674" y="314" text-anchor="start" >physical plan</text><text class="mono" x="674" y="332" text-anchor="start" >calibration.status</text><rect class="surface-2" x="58" y="416" width="852" height="66" rx="4"/><text class="mono-strong" x="74" y="442" text-anchor="start" >HTTP</text><text class="small" x="74" y="462" text-anchor="start" >commands · reads · ranges · uploads</text><text class="mono-strong" x="352" y="442" text-anchor="start" >WebSocket</text><text class="small" x="352" y="462" text-anchor="start" >device push · controller view</text><text class="mono-strong" x="688" y="442" text-anchor="start" >polling</text><text class="small" x="688" y="462" text-anchor="start" >physical console, 1 s while visible</text><text class="small" x="58" y="516" text-anchor="start" >The physical console does not hold a WebSocket. Its Show panel polls playback status.</text>
</svg>
